[mgr]
show_hidden = true


[opener]
play = [{ run = "mpv %s", orphan = true, for = "unix" }]
edit = [{ run = "$EDITOR %s", block = true, for = "unix" }]
open = [{ run = "xdg-open %s", desc = "Open"}]

[open]
prepend_rules = [
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "play" },
	{ mime = "image/*", use = "play" },
	{ mime = "text/*", use = "edit" },
	{ url = "*.json", use = "edit" },
]


