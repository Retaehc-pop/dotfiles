# Prefix: Alt+a (left-alt as the leader modifier)
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Sane defaults
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -g renumber-windows on

# Splits that keep the cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation/resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+arrow to switch panes, no prefix needed
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Alt+|/- to split, Alt+c to close pane, no prefix needed
bind -n M-\| split-window -h -c "#{pane_current_path}"
bind -n M-\- split-window -v -c "#{pane_current_path}"
bind -n M-c kill-pane

# Session management, no prefix needed
bind -n M-q new-session
bind -n M-Tab switch-client -n
bind -n M-n command-prompt -I "#S" "rename-session '%%'"
bind -n M-C run-shell "tmux switch-client -n && tmux kill-session -t '#S'"

# Window management, no prefix needed
bind -n C-M-q new-window -c "#{pane_current_path}"
bind -n C-M-Tab next-window
bind -n C-M-Left previous-window
bind -n C-M-Right next-window
bind -n C-M-c kill-window
bind -n C-M-n command-prompt -I "#W" "rename-window '%%'"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Minimal status bar
set -g status-style bg=default
set -g status-left "[#S] "
set -g status-right-length 150
set -g status-right "#{S:#{?#{==:#{session_name},#S},#[reverse] ,}#{session_name}#[default] }| %H:%M"

# Plugins (prefix + I to install, prefix + U to update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
